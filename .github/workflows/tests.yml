name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run tests
        run: pytest -q

  no-sklearn:
    # The core package must import and fit without the optional scikit-learn.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install without optional extras
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Smoke test
        working-directory: /tmp
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("sklearn") is None
          import numpy as np
          from rsoselect import RSO, PLM, GPLM
          rng = np.random.default_rng(0)
          X = rng.normal(size=(120, 6)); Z = rng.uniform(size=(120, 3))
          y = 2 * X[:, 0] - X[:, 2] + np.sin(2 * np.pi * Z[:, 0]) + 0.3 * rng.normal(size=120)
          m = RSO().fit(X, y); print("RSO", m.support_)
          assert m.support_[0] and m.support_[2]
          print("PLM", PLM().fit(X, Z, y).support_z_)
          PY

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
