[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rsoselect"
version = "0.2.0"
description = "Ridge selection operator (RSO) for variable selection in linear, partially linear and generalized partially linear models"
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [{name = "Youhan Lu"}, {name = "Kan Zhang"}, {name = "Juan Hu"}, {name = "Yichao Wu"}]
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "scipy>=1.7"]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.0"]
test = ["pytest", "scikit-learn>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]
