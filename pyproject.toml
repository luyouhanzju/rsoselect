[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rsoselect"
version = "0.2.0"
description = "Ridge selection operator (RSO) for variable selection in linear, partially linear and generalized partially linear models"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Youhan Lu"}, {name = "Kan Zhang"}, {name = "Juan Hu"}, {name = "Yichao Wu"}]
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "scipy>=1.7"]
keywords = ["variable selection", "feature selection", "ridge regression", "partially linear model", "sparse regression"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/luyouhanzju/rsoselect"
Issues = "https://github.com/luyouhanzju/rsoselect/issues"

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.0"]
test = ["pytest", "scikit-learn>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]
